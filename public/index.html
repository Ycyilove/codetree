<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Code Picker - 快速选取代码文件</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: #1e1e1e; color: #d4d4d4;
    height: 100vh; display: flex; overflow: hidden;
  }
  .sidebar { width: 55%; display: flex; flex-direction: column; border-right: 1px solid #333; }
  .toolbar {
    padding: 12px; background: #252526;
    display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #333;
  }
  .toolbar input {
    flex: 1; padding: 8px 12px; background: #3c3c3c; border: 1px solid #555;
    color: #d4d4d4; border-radius: 4px; font-size: 13px; outline: none;
  }
  .toolbar input:focus { border-color: #007acc; }
  .toolbar button {
    padding: 8px 14px; background: #0e639c; color: white; border: none;
    border-radius: 4px; cursor: pointer; font-size: 13px;
  }
  .toolbar button:hover { background: #1177bb; }
  .toolbar button.ghost { background: #3c3c3c; }
  .toolbar button.ghost:hover { background: #4a4a4a; }

  .tree { flex: 1; overflow-y: auto; padding: 8px 0; user-select: none; }
  .node { padding: 4px 12px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .node:hover { background: #2a2d2e; }
  .node.selected { background: #094771; }
  .node .icon { width: 14px; text-align: center; opacity: 0.7; flex-shrink: 0; }
  .node .name { flex-shrink: 0; }
  .node .size { font-size: 11px; opacity: 0.4; flex-shrink: 0; margin-left: auto; }
  .children { padding-left: 16px; }
  .hidden { display: none; }

  .node.search-result .path {
    color: #6a9955;
    font-size: 12px;
    opacity: 0.9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .right { flex: 1; display: flex; flex-direction: column; background: #1e1e1e; }
  .right-header {
    padding: 12px; background: #252526; border-bottom: 1px solid #333;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .right-header .count { font-size: 13px; color: #999; white-space: nowrap; }
  .right-header .actions { display: flex; gap: 8px; align-items: center; }
  .right-header button {
    padding: 8px 16px; background: #0e639c; color: white; border: none;
    border-radius: 4px; cursor: pointer; font-size: 13px;
    white-space: nowrap;
  }
  .right-header button:hover { background: #1177bb; }
  .right-header button.danger { background: #6b1f1f; }
  .right-header button.danger:hover { background: #8a2828; }
  .right-header button.ghost { background: #3c3c3c; }
  .right-header button.ghost:hover { background: #4a4a4a; }

  .toggle {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: #999; cursor: pointer; user-select: none;
    white-space: nowrap;
  }
  .toggle input { cursor: pointer; }

  .stale-badge {
    display: none;
    background: #d18616; color: #1e1e1e;
    font-size: 11px; padding: 2px 6px; border-radius: 3px;
    font-weight: bold; margin-left: 6px;
  }
  .stale-badge.show { display: inline-block; }

  .preview {
    flex: 1; overflow: auto; padding: 12px;
    font-family: "Consolas", "Monaco", monospace; font-size: 12px;
    white-space: pre; line-height: 1.5;
  }
  .preview .file-marker { color: #4ec9b0; font-weight: bold; }
  .selected-list {
    max-height: 140px; overflow-y: auto; padding: 8px 12px;
    background: #252526; border-bottom: 1px solid #333;
    font-size: 12px; font-family: monospace;
  }
  .selected-list .item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 2px 0; color: #9cdcfe; gap: 8px;
  }
  .selected-list .item span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .selected-list .item button {
    background: none; border: none; color: #f48771; cursor: pointer; font-size: 12px;
    flex-shrink: 0;
  }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #0e639c; color: white; padding: 10px 20px; border-radius: 4px;
    opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="toolbar">
    <input id="search" placeholder="🔍 模糊搜索文件名或路径..." />
    <button class="ghost" id="collapseBtn">折叠全部</button>
  </div>
  <div class="tree" id="tree"></div>
</div>

<div class="right">
  <div class="right-header">
    <span class="count">
      <span id="count">已选 0 个文件</span>
      <span class="stale-badge" id="staleBadge">内容已更新，点击刷新</span>
    </span>
    <div class="actions">
      <label class="toggle" title="每 2 秒自动重新读取已选文件内容">
        <input type="checkbox" id="autoRefresh" /> 自动刷新
      </label>
      <button class="ghost" id="refreshBtn">🔄 刷新</button>
      <button class="danger" id="clearBtn">清空</button>
      <button id="copyBtn">📋 复制全部</button>
    </div>
  </div>
  <div class="selected-list" id="selectedList"></div>
  <div class="preview" id="preview">选中文件后此处显示预览...</div>
</div>

<div class="toast" id="toast"></div>

<script>
const state = {
  tree: [],
  selected: new Set(),   // 存储路径
  fileCache: new Map(),  // path -> content
  mtimeCache: new Map(), // path -> mtime
  collapsed: new Set(),
  stale: false,          // 是否有文件更新但尚未刷新
  autoTimer: null
};

// ============ 工具函数 ============
async function fetchJSON(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1600);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============ 加载文件树 ============
async function loadTree() {
  const data = await fetchJSON('/api/tree');
  state.tree = data.tree;
  renderTree();
}

// ============ 渲染文件树 ============
function renderTree() {
  const container = document.getElementById('tree');
  const keyword = document.getElementById('search').value.trim().toLowerCase();
  container.innerHTML = '';
  if (keyword) {
    const matches = [];
    collectFiles(state.tree, matches);
    const filtered = matches.filter(f => f.path.toLowerCase().includes(keyword));
    if (filtered.length === 0) {
      container.innerHTML = '<div style="padding:12px;color:#666;font-size:13px">无匹配文件</div>';
      return;
    }
    filtered.sort((a, b) => {
      const aName = a.name.toLowerCase().includes(keyword) ? 0 : 1;
      const bName = b.name.toLowerCase().includes(keyword) ? 0 : 1;
      if (aName !== bName) return aName - bName;
      return a.path.localeCompare(b.path);
    });
    filtered.slice(0, 500).forEach(f => {
      container.appendChild(makeSearchResultNode(f));
    });
  } else {
    state.tree.forEach(node => container.appendChild(renderNode(node, '')));
  }
}

function collectFiles(nodes, out) {
  for (const n of nodes) {
    if (n.type === 'file') out.push(n);
    else if (n.children) collectFiles(n.children, out);
  }
}

function renderNode(node, parentPath) {
  if (node.type === 'file') return makeFileNode(node, node.path);

  const wrapper = document.createElement('div');
  const isCollapsed = state.collapsed.has(node.path);
  const dirEl = document.createElement('div');
  dirEl.className = 'node';
  dirEl.innerHTML = `<span class="icon">${isCollapsed ? '▶' : '▼'}</span><span class="name">📁 ${escapeHtml(node.name)}</span>`;
  dirEl.onclick = () => {
    if (isCollapsed) state.collapsed.delete(node.path);
    else state.collapsed.add(node.path);
    renderTree();
  };
  wrapper.appendChild(dirEl);

  const childrenEl = document.createElement('div');
  childrenEl.className = 'children' + (isCollapsed ? ' hidden' : '');
  node.children.forEach(c => childrenEl.appendChild(renderNode(c, node.path)));
  wrapper.appendChild(childrenEl);
  return wrapper;
}

function makeSearchResultNode(file) {
  const el = document.createElement('div');
  el.className = 'node search-result' + (state.selected.has(file.path) ? ' selected' : '');
  const sizeStr = file.size < 1024 ? `${file.size}B` : `${(file.size/1024).toFixed(1)}K`;
  el.innerHTML = `
    <span class="icon">${state.selected.has(file.path) ? '☑' : '☐'}</span>
    <span class="name">${escapeHtml(file.name)}</span>
    <span class="path">${escapeHtml(file.path)}</span>
    <span class="size">${sizeStr}</span>
  `;
  el.title = file.path;
  el.onclick = () => toggleSelect(file.path, file);
  return el;
}

function makeFileNode(file, fullPath) {
  const el = document.createElement('div');
  el.className = 'node' + (state.selected.has(fullPath) ? ' selected' : '');
  const sizeStr = file.size < 1024 ? `${file.size}B` : `${(file.size/1024).toFixed(1)}K`;
  el.innerHTML = `<span class="icon">${state.selected.has(fullPath) ? '☑' : '☐'}</span>
                  <span class="name">${escapeHtml(file.name)}</span>
                  <span class="size">${sizeStr}</span>`;
  el.title = fullPath;
  el.onclick = () => toggleSelect(fullPath, file);
  return el;
}

// ============ 选中/取消 ============
async function toggleSelect(path, file) {
  if (state.selected.has(path)) {
    state.selected.delete(path);
  } else {
    state.selected.add(path);
    if (!state.fileCache.has(path)) {
      try {
        const data = await fetchJSON('/api/file?path=' + encodeURIComponent(path));
        state.fileCache.set(path, data.content);
        if (data.mtime) state.mtimeCache.set(path, data.mtime);
      } catch (e) {
        state.fileCache.set(path, `[读取失败: ${e.message}]`);
      }
    }
  }
  renderTree();
  renderSelected();
}

// ============ 刷新已选文件内容 ============
async function refreshSelected(silent = false) {
  const paths = [...state.selected];
  if (paths.length === 0) {
    if (!silent) showToast('没有已选文件');
    return;
  }
  const data = await fetchJSON('/api/files', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ paths })
  });
  let changed = 0;
  for (const f of data.files) {
    const oldMtime = state.mtimeCache.get(f.path);
    const oldContent = state.fileCache.get(f.path);
    if (oldContent !== f.content) changed++;
    state.fileCache.set(f.path, f.content);
    if (f.mtime) state.mtimeCache.set(f.path, f.mtime);
  }
  state.stale = false;
  document.getElementById('staleBadge').classList.remove('show');
  renderSelected();
  if (!silent) {
    showToast(changed > 0 ? `🔄 已刷新，${changed} 个文件有更新` : '🔄 已刷新，内容无变化');
  }
  return changed;
}

// 静默检查（用于自动刷新，避免频繁弹 toast）
async function checkUpdates() {
  if (state.selected.size === 0) return;
  try {
    const paths = [...state.selected];
    const data = await fetchJSON('/api/files', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paths })
    });
    let changed = 0;
    for (const f of data.files) {
      if (state.fileCache.get(f.path) !== f.content) {
        state.fileCache.set(f.path, f.content);
        if (f.mtime) state.mtimeCache.set(f.path, f.mtime);
        changed++;
      }
    }
    if (changed > 0) {
      state.stale = false;
      document.getElementById('staleBadge').classList.remove('show');
      renderSelected();
    }
  } catch (e) {
    // 静默失败
  }
}

// ============ 渲染已选列表与预览 ============
function renderSelected() {
  const count = state.selected.size;
  document.getElementById('count').textContent = `已选 ${count} 个文件`;

  const listEl = document.getElementById('selectedList');
  listEl.innerHTML = '';
  const paths = [...state.selected].sort();
  paths.forEach(p => {
    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML = `<span title="${escapeHtml(p)}">${escapeHtml(p)}</span>`;
    const btn = document.createElement('button');
    btn.textContent = '✕';
    btn.onclick = () => {
      state.selected.delete(p);
      renderTree();
      renderSelected();
    };
    item.appendChild(btn);
    listEl.appendChild(item);
  });

  const previewEl = document.getElementById('preview');
  if (count === 0) {
    previewEl.textContent = '选中文件后此处显示预览...';
    return;
  }
  const output = buildOutput(paths);
  previewEl.innerHTML = escapeHtml(output).replace(
    /^(====== .+? ======)$/gm,
    '<span class="file-marker">$1</span>'
  );
}

function buildOutput(paths) {
  return paths.map(p => {
    const content = state.fileCache.get(p) ?? '';
    return `====== ${p} ======\n${content}`;
  }).join('\n\n');
}

// ============ 事件绑定 ============
document.getElementById('search').addEventListener('input', renderTree);

document.getElementById('collapseBtn').onclick = () => {
  state.collapsed.clear();
  const collectDirs = (nodes) => {
    for (const n of nodes) {
      if (n.type === 'dir') {
        state.collapsed.add(n.path);
        collectDirs(n.children);
      }
    }
  };
  collectDirs(state.tree);
  renderTree();
};

document.getElementById('clearBtn').onclick = () => {
  state.selected.clear();
  state.fileCache.clear();
  state.mtimeCache.clear();
  state.stale = false;
  document.getElementById('staleBadge').classList.remove('show');
  renderTree();
  renderSelected();
};

document.getElementById('refreshBtn').onclick = () => refreshSelected(false);

document.getElementById('autoRefresh').onchange = (e) => {
  if (state.autoTimer) {
    clearInterval(state.autoTimer);
    state.autoTimer = null;
  }
  if (e.target.checked) {
    state.autoTimer = setInterval(checkUpdates, 2000);
    showToast('已开启自动刷新（每 2 秒）');
  } else {
    showToast('已关闭自动刷新');
  }
};

document.getElementById('copyBtn').onclick = async () => {
  if (state.selected.size === 0) return showToast('请先选择文件');
  const paths = [...state.selected].sort();
  const btn = document.getElementById('copyBtn');
  const orig = btn.textContent;
  btn.textContent = '读取中...';
  btn.disabled = true;
  try {
    // 方案 A：复制前强制重新拉取所有选中文件，确保拿到最新内容
    const data = await fetchJSON('/api/files', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paths })
    });
    for (const f of data.files) {
      state.fileCache.set(f.path, f.content);
      if (f.mtime) state.mtimeCache.set(f.path, f.mtime);
    }
    state.stale = false;
    document.getElementById('staleBadge').classList.remove('show');
    renderSelected();

    const text = buildOutput(paths);
    try {
      await navigator.clipboard.writeText(text);
      showToast(`✅ 已复制 ${paths.length} 个文件 (${text.length} 字符)`);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('✅ 已复制（降级方案）');
    }
  } catch (e) {
    showToast('❌ 读取失败: ' + e.message);
  } finally {
    btn.textContent = orig;
    btn.disabled = false;
  }
};

// ============ 启动 ============
loadTree();
</script>
</body>
</html>
